[General]
; Text size in the studio (pixels at 1080p)
fFontSize=18
; Extra interface size (0.6 - 2.0)
fUIScale=1.0
; Cursor speed in the studio
fMouseSpeed=1.0

[Studio]
; Size of the painting HUD (palette and tools panels), 0.6 - 1.2. Also set in game: "HUD size" in the tools panel.
fHudSize=0.85
; The painted canvas's relief (thick paint, the canvas weave) is lit by the game. If ridges of paint look
; like grooves, or are lit from the side instead of from above, change these two and repaint a stroke:
bReliefSwapXY=1
bReliefFlipY=0

[Palette]
; Colours you mixed and added to the palette (written by the game)
sMixed=

[Debug]
bHookPresent=1
bInputSink=1
; While the studio is open, the game and other mods get no keys
bBlockInput=1

[VR]
; Skyrim VR only (the SkyrimPainter VR download). Ignored in SE / AE.
; The brush is in your main hand and the palette in the other. Set to 1 to swap them.
bLeftHanded=0
; Show the brush and palette models in your hands (0 = just the panel).
bShowModels=1
; How strongly the controller buzzes when the brush touches the canvas (0 = off, 1 = normal, 2 = strong).
fHaptics=1.0
; The panel above the palette, relative to the palette-hand controller: width and position in metres, tilt in degrees.
fPanelWidth=0.34
fPanelX=0.0
fPanelY=0.09
fPanelZ=-0.06
fPanelTilt=-35
; Menus (easel, hung paintings) float in front of you: distance and width in metres.
fMenuDistance=0.7
fMenuWidth=0.55
; Where the brush's tip is, in game units from the brush hand (Y is forward). If paint lands short of or
; past the bristles, change fBrushTipY.
fBrushTipX=0.0
fBrushTipY=9.5
fBrushTipZ=0.0
; How the brush model sits in your hand (degrees, game units).
fBrushYaw=90
fBrushForward=2.0
fBrushDown=-0.5
; How the palette model sits in your other hand.
fPaletteX=0.0
fPaletteY=4.0
fPaletteZ=2.0
fPalettePitch=-35
